name: purchase_completed
domain: purchase
version: 1
sources: [browser, server]
description: "An order was paid for. Send it from the backend, where the payment result is known."
blocks: [commerce]
properties:
  commerce.orderId: { required: true }
  commerce.items: { required: true, minItems: 1 }
  commerce.currency: { required: true }
  commerce.total: { required: true, minimum: 0 }
example:
  commerce: { orderId: o1, items: [{ productId: p123, quantity: 2, price: 89.99 }], currency: USD, total: 179.98 }
