name: purchase_completed
domain: orders_payments
version: 1
sources: [browser, server]
description: "An order was paid for. Send it from the backend, where the payment result is known."
blocks: [order]
properties:
  order.id: { required: true }
  order.items: { required: true, minItems: 1 }
  order.currency: { required: true }
  order.total: { required: true, minimum: 0 }
example:
  order: { id: o1, total: 179.98, items: [{ productId: p123, quantity: 2, price: 89.99 }], currency: USD }
