name: recommendation_impression
domain: search_discovery
version: 1
sources: [browser]
description: "A recommendation list was shown."
aliases: [recommendation_carousel_impression, product_recommendation_impression]
blocks: [list, recommendation]
properties:
  recommendation.id: { required: true }
  list.productIds: { required: true, minItems: 1 }
example:
  list: { productIds: [p123, p456] }
  recommendation: { id: rec_42, provider: amazon-personalize }
