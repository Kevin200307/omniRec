services:
  # Durable event bus between ingestion and provider delivery. Without it, a
  # provider outage loses events; with it, they queue and drain when the
  # provider recovers.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Probing too early runs the CLI as root before the server has created its
      # Erlang cookie, leaving the cookie unreadable to the server, which then dies.
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # The standalone Event API. Provider credentials live here and only here —
  # the storefront holds a publishable key and nothing else.
  event-api:
    build:
      context: .
      dockerfile: backend/omnirec-event-api-app/Dockerfile
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_HOST: rabbitmq
      QUEUE_ENABLED: "true"
      REDIS_STATE_ENABLED: "true"
      REDIS_HOST: redis
      DEMO_STORE_API_KEY: pk_test_demo_store
      # Every destination is off by default, so this boots with no cloud
      # account of any kind. Enabling one is a flag plus that provider's own
      # server-side credentials — never a code change.
      PERSONALIZE_ENABLED: "false"
      GOOGLE_RETAIL_ENABLED: "false"
      # Keeps the serving API's /v1/recently-viewed current. Local; no account needed.
      RECENTLY_VIEWED_ENABLED: "true"
      RECENTLY_VIEWED_REDIS_HOST: redis
      RECENTLY_VIEWED_TENANT_ID: demo-store
      # When you do enable Amazon, credentials come from the AWS default
      # provider chain (an IAM role in production), not from configuration:
      #   AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
      #   AWS_PERSONALIZE_TRACKING_ID
      # And for Google: GOOGLE_PROJECT_NUMBER + GOOGLE_APPLICATION_CREDENTIALS.
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  # The original personalization/serving backend — recommendations, search, and
  # recently-viewed. Separate from event collection on purpose: reading
  # personalisation results is a different concern from collecting signals.
  serving-api:
    build:
      context: .
      dockerfile: backend/omnirec-demo-app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - redis
