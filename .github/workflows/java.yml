name: java

on:
  pull_request:
    paths:
      - "backend/**"
      - "schema/**"
      - ".github/workflows/java.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "schema/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Runs omnirec-contract-tests along with everything else. That module
      # parses the TypeScript SDK and the JSON schema and fails the build if the
      # three definitions of the canonical event have drifted apart — which is
      # what makes maintaining three copies safe.
      - run: mvn -f backend/pom.xml -B clean install
