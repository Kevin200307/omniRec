# SPDX-License-Identifier: Apache-2.0
name: java

on:
  pull_request:
    paths:
      - "backend/**"
      - "schema/**"
      - "catalog/**"
      - ".github/workflows/java.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "schema/**"
      - "catalog/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # StandardEvents.java and omnirec/catalog.json are generated from catalog/.
      # Fail fast with a clear message if they are stale, before compiling.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check generated files are up to date with the catalog
        run: npm run catalog:check
      # Runs omnirec-contract-tests along with everything else. That module
      # parses the TypeScript SDK and the JSON schema and fails the build if the
      # three definitions of the canonical event have drifted apart — which is
      # what makes maintaining three copies safe.
      - run: mvn -f backend/pom.xml -B clean install
